<!DOCTYPE html>
<!-- Root HTML document for Hari Awaaz, a simple complaint helper page -->
<html lang="en">
<head>
  <!-- Metadata: character set and responsive scaling for mobile screens -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page title shown in the browser tab -->
  <title>Hari Aawaz – Environmental Complaint Helper</title>
  <!-- Styles moved into a separate style.css file -->
  <link rel="stylesheet" href="style.css" />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <!-- Wrapper that keeps content centered and easy to read -->
  <div class="wrap">

    <!-- Main heading naming the tool -->
    <h1>Hari Aawaz – Environmental Complaint Helper</h1>

    <!-- One line explaining what the tool does for Jaipur citizens -->
    <p class="intro">
      Describe an environmental problem near you in Jaipur and we'll help you
      turn it into a clear, ready-to-submit complaint.
    </p>

    <!-- Large text box: type the complaint in Hindi, English, or Hinglish -->
    <textarea
      id="complaint-input"
      placeholder="अपनी शिकायत यहाँ लिखें... (Hindi, English, or Hinglish)"
      aria-label="Complaint text"></textarea>
    
    <div style="display:flex; gap:8px; align-items:center; margin:6px 0 12px;">
      <select id="micLang" aria-label="Speech language" style="width:auto;">
        <option value="hi-IN">Speak in Hindi</option>
        <option value="en-IN">Speak in English</option>
      </select>
      <span id="micBtn" role="button" tabindex="0"
        style="background:#2e7d4f;color:#fff;padding:12px 20px;border-radius:10px;cursor:pointer;display:inline-block;user-select:none;">
        🎤 Speak
      </span>
    </div>

    <label for="location-input">Location / Landmark (Jaipur)</label>
    <input type="text" id="location-input" placeholder="e.g., Near Central Park Gate 2, C-Scheme / Ward 45" />
    
    <label class="language-label" for="letterLang">Letter language</label>
    <select id="letterLang" name="letterLang">
      <option value="English">English</option>
      <option value="Hindi (Devanagari)">Hindi (हिन्दी)</option>
    </select>

    <!-- Button the user presses once the complaint is ready -->
    <button type="button">Get Help</button>

    <!-- Placeholder area where the result card is inserted by script.js -->

    <!-- Small footer with the prototype disclaimer and safety note -->
    <footer>
      Prototype. Always verify details with the official authority. Do not
      enter phone numbers or personal details.
    </footer>

  </div>

  <!-- JavaScript for the "Get Help" flow (mock data for now) -->
  <script src="script.js"></script>
</body>
</html>
